<!doctype html><html><head><meta charset="utf-8"><title>FEISAR model viewer</title>
<style>body{margin:0;background:#fff}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body>
<script type="module">
// Dev viewer: ?v=az,el,dist;az,el,dist  (&ortho=1 for orthographic, &bg=000000, &plain=1 skips livery)
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { applyLivery } from '../js/livery.js';
const q = new URLSearchParams(location.search);
const views = (q.get('v') || '0.6,0.35,13').split(';').map(s => s.split(',').map(Number));
const ortho = q.get('ortho') === '1';
const W = innerWidth / views.length | 0, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, H); r.setScissorTest(true);
r.toneMapping = THREE.NeutralToneMapping; document.body.appendChild(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color('#' + (q.get('bg') || 'ffffff'));
sc.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(r), .03).texture; sc.environmentIntensity = .7;
sc.add(new THREE.HemisphereLight(0xffffff, 0xb9c8e0, .5)); const k = new THREE.DirectionalLight(0xffffff, 2); k.position.set(6, 12, 8); sc.add(k);
new GLTFLoader().load('../assets/models/feisar_fx350.glb', async g => {
  if (q.get('plain') !== '1') await applyLivery(g.scene, r);
  sc.add(g.scene);
  const box = new THREE.Box3().setFromObject(g.scene), ctr = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
  views.forEach(([az, el, d], i) => {
    let c;
    if (ortho) { const h = Math.max(size.z * H / W, size.y, size.x * H / W) * .55; c = new THREE.OrthographicCamera(-h * W / H, h * W / H, h, -h, .1, 100); }
    else c = new THREE.PerspectiveCamera(28, W / H, .1, 100);
    const look = q.get('look') ? new THREE.Vector3(...q.get('look').split(',').map(Number)) : ctr;
    c.position.set(look.x + Math.sin(az) * Math.cos(el) * d, look.y + Math.sin(el) * d, look.z + Math.cos(az) * Math.cos(el) * d);
    c.lookAt(look);
    r.setViewport(i * W, 0, W, H); r.setScissor(i * W, 0, W, H); r.render(sc, c);
  });
  document.title = 'done';
});
</script></body></html>
