<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FEISAR FX350 · anatomy</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;

  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(1080px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>.fx {
  --fx-blend: screen;
  --fx-button-hover: #232323;
  --fx-button-ring: #ffffff14;
  --fx-part-ring: #ffffff10;
  --fx-part-hover: #ffffff0a;
  --fx-lamp-off: #4a4a4a;
  --fx-lamp-on: #38bdf8;
  --fx-lamp-glow: #38bdf888;
  --fx-lamp-armed: #ffcc00;
  --fx-rim: #ffb46e;
  --fx-rim-soft: #ff8a3c;
  --fx-rim-soft-share: 0.45;
  --fx-flash-0: #fff4e6;
  --fx-flash-1: #ffd2a066;
  --fx-flash-2: #ff9a5a22;
  --fx-flash-3: #ff9a5a00;
  --fx-deck-0: #ffcf98;
  --fx-deck-1: #ff8a3abf;
  --fx-deck-2: #b34a1247;
  --fx-deck-3: #5a220800;
  --fx-deck-share: 1;
}

[data-theme="light"] .fx {
  --fx-blend: normal;
  --fx-button-hover: #f0f0ed;
  --fx-button-ring: #0000001a;
  --fx-part-ring: #00000014;
  --fx-part-hover: #0000000a;
  --fx-lamp-off: #c4c4c4;
  --fx-lamp-on: #0047bb;
  --fx-lamp-glow: #0047bb55;
  --fx-lamp-armed: #d9a900;
  --fx-rim: #c2410c;
  --fx-rim-soft: #ea580c;
  --fx-rim-soft-share: 0.25;
  --fx-flash-0: #ffd9b0;
  --fx-flash-1: #ffb07a44;
  --fx-flash-2: #ff8a4a14;
  --fx-flash-3: #ff8a4a00;
  --fx-deck-0: #c2410c;
  --fx-deck-1: #ea580c8c;
  --fx-deck-2: #f9731633;
  --fx-deck-3: #f9731600;
  --fx-deck-share: 0.45;
}

.fx .iso-plate {
  padding: 52px 24px 64px;
  overflow: hidden;
}

.fx-stage {
  position: relative;
  border-radius: 10px;
  touch-action: pan-y;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  will-change: transform;
}

.fx-stage:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 6px;
}

.fx-stage > svg,
.fx-stage > canvas,
.fx-stage > div {
  display: block;
  width: 100%;
  height: auto;
}

.fx-front,
.fx-layer,
.fx-field,
.fx-glow,
.fx-veil,
.fx-flash {
  position: absolute;
  inset: 0;
  height: 100% !important;
}

.fx-field,
.fx-glow,
.fx-veil,
.fx-flash {
  pointer-events: none;
}

.fx-field,
.fx-glow,
.fx-veil {
  mix-blend-mode: var(--fx-blend);
}

.fx-glow {
  overflow: visible;
}

.fx-front {
  pointer-events: none;
  overflow: visible;
}

.fx-front .it {
  pointer-events: visiblePainted;
}

.fx-flash {
  opacity: 0;
  mix-blend-mode: var(--fx-blend);
  background: radial-gradient(circle closest-side at var(--gx) var(--gy), var(--fx-flash-0) 0%, var(--fx-flash-1) 24%, var(--fx-flash-2) 56%, var(--fx-flash-3) 100%);
}

.fx-shadow {
  opacity: 0.45;
}

.tb-body {
  fill: var(--anatomy-shade-2);
  stroke: none;
}

.tb-shine {
  fill: var(--anatomy-top);
  stroke: none;
}

.tb-shade {
  fill: var(--anatomy-shade-0);
  stroke: none;
}

.fx-stage[data-focus] .it:not([data-on]):not([data-piece="stand"]) {
  --anatomy-hi: var(--anatomy-mid);
  --anatomy-mid: var(--anatomy-lo);
}

.fx-stage[data-focus] .it[data-piece="stand"] {
  --anatomy-mid: var(--anatomy-lo);
}

.it[data-on] {
  --anatomy-hi: var(--anatomy-lit);
  --anatomy-mid: var(--anatomy-hi);
}

.it[data-on] .iso-top,
.it[data-on] .tb-shine {
  fill: var(--anatomy-lit-top);
}

.it[data-on] .iso-shade,
.it[data-on] .tb-body {
  fill: var(--anatomy-lit-shade);
}

.it[data-on] [data-seamless] > .iso-shade {
  stroke: var(--anatomy-lit-shade);
}

.it[data-on] [data-seamless] > .iso-top {
  stroke: var(--anatomy-lit-top);
}

.fx-controls {
  position: absolute;
  left: 20px;
  bottom: 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--anatomy-mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--anatomy-muted);
}

.fx-engage {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 28px;
  padding: 0 13px 0 11px;
  border: 0;
  border-radius: 999px;
  background: var(--anatomy-face);
  color: var(--anatomy-strong);
  font: inherit;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--fx-button-ring);
  transition: background 200ms var(--anatomy-ease), color 200ms var(--anatomy-ease), transform 160ms var(--anatomy-ease);
}

.fx-engage:hover {
  background: var(--fx-button-hover);
}

.fx-engage:active {
  transform: scale(0.97);
}

.fx-engage:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 3px;
}

.fx-lamp {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--fx-lamp-off);
  box-shadow: 0 0 0 0 transparent;
  transition: background 240ms var(--anatomy-ease), box-shadow 240ms var(--anatomy-ease);
}

.fx-engage[data-state="on"] .fx-lamp {
  background: var(--fx-lamp-on);
  box-shadow: 0 0 10px 2px var(--fx-lamp-glow);
}

.fx-engage[data-state="armed"] .fx-lamp {
  background: var(--fx-lamp-armed);
  box-shadow: 0 0 8px 1px var(--fx-lamp-glow);
}

.fx-parts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 6px;
}

.fx-part {
  display: inline-flex;
  align-items: baseline;
  gap: 7px;
  padding: 5px 10px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--anatomy-muted);
  font: 12.5px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--fx-part-ring);
  transition: color 160ms var(--anatomy-ease), background 160ms var(--anatomy-ease);
}

.fx-part:hover,
.fx-part:focus-visible,
.fx-part[data-on] {
  color: var(--anatomy-strong);
  background: var(--fx-part-hover);
  outline: none;
}

.fx-num {
  font-family: var(--anatomy-mono);
  font-size: 10px;
  color: var(--anatomy-muted);
}

@media (max-width: 640px) {
  .fx .iso-plate {
    padding: 48px 8px 88px;
  }

  .fx .iso-plate-corner[data-corner="readout"] {
    bottom: 46px;
    right: 0;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .fx-stage[data-focus] ~ .fx-controls .fx-hint {
    visibility: hidden;
  }

  .fx-controls {
    left: 14px;
    bottom: 14px;
    gap: 10px;
    max-width: calc(100% - 28px);
    flex-wrap: wrap;
  }

  .fx-hint {
    font-size: 9.5px;
    letter-spacing: 0.06em;
    line-height: 1.3;
  }
}

@media (prefers-reduced-motion: reduce) {
  .fx * {
    transition: none !important;
  }
}

.fx-live {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.fx-rim {
  fill: none;
  stroke: var(--fx-rim);
  stroke-width: 1.3;
  stroke-linecap: round;
  opacity: var(--rim, 0);
  pointer-events: none;
}

.iso-svg .fx-rim-soft {
  stroke: var(--fx-rim-soft);
  stroke-width: 7;
  vector-effect: none;
  filter: blur(4px);
  opacity: calc(var(--rim, 0) * var(--fx-rim-soft-share));
}

.fx-deckglow {
  opacity: calc(var(--deck-glow, 0) * var(--fx-deck-share));
  mix-blend-mode: var(--fx-blend);
  pointer-events: none;
}

.fx-stop-0 {
  stop-color: var(--fx-deck-0);
}

.fx-stop-1 {
  stop-color: var(--fx-deck-1);
}

.fx-stop-2 {
  stop-color: var(--fx-deck-2);
}

.fx-stop-3 {
  stop-color: var(--fx-deck-3);
}

.fx-void {
  fill: #18202b;
  stroke: none;
}
.fx-craft { will-change: transform; }
.iso-plate-corner[data-corner="readout"] { font-variant-numeric: tabular-nums; }

.fx-tri { stroke-width: 0.45; stroke-linejoin: round; }
.fx-edge { stroke-width: 0.55; }
.fx-stage[data-focus] .it:not([data-on]):not([data-piece="stand"]) .fx-tri { opacity: 0.38; }
.it[data-on] .fx-tri { filter: saturate(1.15) brightness(1.04); }

.fx-shade { fill: #0a1426; stroke: none; }

.fx-ghost { transition: opacity 420ms var(--anatomy-ease); }
.fx-stage[data-apart] .fx-ghost { opacity: 0.12; }

.fx-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.fx-layer { pointer-events: none; overflow: visible; will-change: transform; transform-origin: 0 0; }
.fx-layer path, .fx-layer use, .fx-layer g { pointer-events: visiblePainted; }
.fx-stage[data-focus] .fx-layer:not([data-on]) { opacity: 0.42; }
.fx-layer[data-on] { filter: saturate(1.2) brightness(1.06) drop-shadow(0 0 2px rgba(0, 71, 187, 0.35)); }

/* embed mode (the site's Anatomy scene): no page chrome, the card fills the frame */
html:has(body.fx-embed) { background: transparent; color-scheme: light; }
body.fx-embed { margin: 0; padding: 0; background: transparent; overflow: hidden; }
body.fx-embed .iso-page { width: 100%; margin: 0; }
body.fx-embed .iso-figure { margin: 0 auto; width: min(100vw, calc((100vh - 138px) * 1.43)); }
body.fx-embed .iso-plate { padding: 36px 12px 50px; }
body.fx-embed .iso-caption { display: none; }
body.fx-embed .iso-legend { padding: 6px 2px 0; margin: 0; }
body.fx-embed .fx-parts { margin: 0; gap: 4px; justify-content: center; }
body.fx-embed .fx-part { padding: 3px 8px; font-size: 10.5px; }

/* ---- the FEISAR livery on kit panels: each paint in the kit's five light bands */
.fx-panel [data-paint] { stroke-width: 0.35; stroke-linejoin: round; }
.fx-panel [data-paint="blue"]   { --p0: #0f3f66; --p1: #175b8f; --p2: #2172b0; --p3: #2f8bc9; --p4: #4aa3dc; }
.fx-panel [data-paint="yellow"] { --p0: #8a6a00; --p1: #b88d00; --p2: #d9a900; --p3: #efc21a; --p4: #fbd54a; }
.fx-panel [data-paint="white"]  { --p0: #9aa3ad; --p1: #c3cad1; --p2: #dde2e7; --p3: #eef1f4; --p4: #fbfcfd; }
.fx-panel [data-paint="pale"]   { --p0: #7fa4b0; --p1: #a6c9d3; --p2: #c4e2ea; --p3: #d9f0f5; --p4: #ebf9fc; }
.fx-panel [data-paint="dark"]   { --p0: #121519; --p1: #1d2228; --p2: #2a3038; --p3: #363d47; --p4: #454d58; }
.fx-panel [data-paint="red"]    { --p0: #6e1414; --p1: #951c1c; --p2: #b82626; --p3: #d23434; --p4: #e45050; }

span>AG field emitters</button><button type="button" class="fx-part" data-part="thrust"><span class="fx-num">10</span>Syrus plasma ramjet</button><button type="button" class="fx-part" data-part="nacelle"><span class="fx-num">11</span>Engine nacelle</button><button type="button" class="fx-part" data-part="podL"><span class="fx-num">12</span>Port side and pod</button><button type="button" class="fx-part" data-part="podR"><span class="fx-num">13</span>Starboard side and pod</button><button type="button" class="fx-part" data-part="keel"><span class="fx-num">14</span>Keel and airframe</button><button type="button" class="fx-part" data-part="plumbing"><span class="fx-num">15</span>Coolant and harness</button></span><span class="iso-caption">The FX350 is held up by its track, not by itself: four Delft field emitters drive a travelling field against the passive Halbach lattice cast into every federal track, and the repulsion falls off as e<sup>−2kh</sup> with the gap, so the craft settles where the lift equals its 12.4 kN weight: 1200 mm at 2.4 kA, lifting off its cradles at 1.58 kA. The Syrus plasma ramjet swallows air through both pod intakes, compresses it magnetically and heats it in an aneutronic p-¹¹B chamber; 78 kN against a 0.62 m² drag area gives 1,632 km/h. The Tru-Fly core's flywheel stores 2,993 N·m·s of angular momentum against roll — the handling FEISAR is famous for.</span></figcaption></figure></main><script type="module">const GLSL_ISO = `precision highp float;
uniform vec2 uCanvas;
uniform vec2 uView;
uniform vec2 uOrigin;
uniform float uK;
uniform vec4 uCam;
uniform float uTime;
vec2 viewOf(vec2 frag){return vec2(frag.x,uCanvas.y-frag.y)*(uView.x/uCanvas.x);}
vec2 project(vec3 p){return uOrigin+uK*vec2(p.x*uCam.x-p.y*uCam.y,(p.x*uCam.y+p.y*uCam.x)*uCam.z-p.z*uCam.w);}
vec3 towardViewer(){return vec3(uCam.y*uCam.w,uCam.x*uCam.w,uCam.z);}
vec3 rayOf(vec2 vb){vec2 q=(vb-uOrigin)/uK;return vec3(q.x*uCam.x,-q.x*uCam.y,-q.y/uCam.w);}
float pixelOf(){return (uView.x/uCanvas.x)/uK;}
vec3 lightDir(){return normalize(vec3(-uCam.x,uCam.y,1.2));}
vec3 onFloor(vec2 vb,float h){vec2 q=(vb-uOrigin)/uK;float b=(q.y+h*uCam.w)/uCam.z;return vec3(q.x*uCam.x+b*uCam.y,-q.x*uCam.y+b*uCam.x,h);}
vec3 onWallY(vec2 vb,float y){vec2 q=(vb-uOrigin)/uK;float x=(q.x+y*uCam.y)/uCam.x;return vec3(x,y,((x*uCam.y+y*uCam.x)*uCam.z-q.y)/uCam.w);}
vec3 onWallX(vec2 vb,float x){vec2 q=(vb-uOrigin)/uK;float y=(x*uCam.x-q.x)/uCam.y;return vec3(x,y,((x*uCam.y+y*uCam.x)*uCam.z-q.y)/uCam.w);}

  let moving = false;
  for (const id of IDS) if (steerSpring(piece[id], dt, calm)) moving = true;
  const fieldMoving = stepField(dt, calm);
  place();
  if (window.FX_FRAME) window.FX_FRAME({ dt, field, apart: piece });
  say(idleText());
  frame = visible && (moving || fieldMoving || touring || field.on) ? requestAnimationFrame(tick) : 0;
}

function run() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}

new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();
  },
  { rootMargin: "120px 0px" },
).observe(stage);

function pieceAt(event) {
  const hit = document.elementFromPoint(event.clientX, event.clientY);
  const item = hit && hit.closest ? hit.closest(".it, .fx-layer") : null;
  return item ? item.dataset.piece : null;
}

stage.addEventListener("pointermove", (event) => {
  if (event.pointerType === "touch") return;
  inside = true;
  clearTimeout(leaveTimer);
  quietTour();
  if (field.on) return;
  setApart(true);
  select(pieceAt(event));
  run();
});

stage.addEventListener("pointerleave", () => {
  inside = false;
  clearTimeout(leaveTimer);
  leaveTimer = setTimeout(() => {
    if (inside) return;
    select(null);
    setApart(false);
  }, 260);
});

stage.addEventListener("pointerdown", (event) => {
  if (event.pointerType !== "touch" || field.on) return;
  quietTour();
  const id = pieceAt(event);
  if (!id || id === "stand") {
    select(null);
    setApart(!apart);
  } else {
    setApart(true);
    select(id);
  }
  run();
});

engageButton.addEventListener("click", () => {
  quietTour();
  if (!field.on) {
    select(null);
    setApart(false);
  }
  setField(!field.on);
});

partButtons.forEach((button) => {
  const show = () => {
    if (field.on) setField(false);
    quietTour();
    clearTimeout(leaveTimer);
    setApart(true);
    select(button.dataset.part);
    run();
  };
  const hide = () => {
    clearTimeout(leaveTimer);
    leaveTimer = setTimeout(() => {
      if (inside || partButtons.some((other) => other.matches(":hover, :focus-visible"))) return;
      select(null);
      setApart(false);
    }, 260);
  };
  button.addEventListener("pointerenter", show);
  button.addEventListener("focus", show);
  button.addEventListener("pointerleave", hide);
  button.addEventListener("blur", hide);
  button.addEventListener("click", show);
});

stage.addEventListener("keydown", (event) => {
  const index = selected ? D.order.indexOf(selected) : -1;
  let next = null;
  if (event.key === "ArrowRight" || event.key === "ArrowDown") next = Math.min(D.order.length - 1, index + 1);
  else if (event.key === "ArrowLeft" || event.key === "ArrowUp") next = Math.max(0, index - 1);
  else if (event.key === "Home") next = 0;
  else if (event.key === "End") next = D.order.length - 1;
  else if (event.key === "Escape") {
    event.preventDefault();
    quietTour();
    setField(false);
    select(null);
    setApart(false);
    run();
    return;
  } else if (event.key === "e" || event.key === "E" || event.key === "Enter") {
    event.preventDefault();
    quietTour();
    select(null);
    setApart(false);
    setField(!field.on);
    return;
  } else if (event.key === " ") {
    event.preventDefault();
    quietTour();
    setField(false);
    setApart(!apart);
    if (!apart) select(null);
    run();
    return;
  }
  if (next === null) return;
  event.preventDefault();
  quietTour();
  setField(false);
  setApart(true);
  select(D.order[next]);
  run();
});

// ---------------------------------------------------------------- the field and the plume (WebGL)
// world space, in the figure's own camera: one glowing column per emitter from its face to the
// lattice, the light those columns lay on the tiles, and the Syrus exhaust leaving the nacelle.
// Light theme: the colour the paper should show is solved for its ink (anatomy webgl.md, 8.1).
const LIGHT_THEME = document.body.dataset.theme === "light" ? 1 : 0;
const EM = D.emitters.flat();
while (EM.length < 20) EM.push(0);
const FIELD_FRAG = `
uniform float uField, uThrust, uRise, uLight;
uniform vec4 uEm[5];
uniform vec4 uPl;
const float ZL = ${D.zlat.toFixed(2)};
vec4 over(vec4 top, vec4 under) { return top + under * (1. - top.a); }
vec4 inkFor(vec3 seen, float cover) { vec3 ab = 1. - seen; float a = max(max(ab.r, max(ab.g, ab.b)), cover); return vec4(vec3(a) - ab, a); }
vec3 paperOf(float e) {
  vec3 c = vec3(1.);
  c = mix(c, vec3(.85, .93, 1.), smoothstep(0., .12, e));
  c = mix(c, vec3(.16, .42, .94), smoothstep(.1, .5, e));
  c = mix(c, vec3(.2, .68, 1.), smoothstep(.45, .7, e));
  c = mix(c, vec3(.9, .98, 1.), smoothstep(.68, .95, e));
  return c;
}
void main() {
  vec2 vb = viewOf(gl_FragCoord.xy);
  vec3 p0 = rayOf(vb);
  vec3 V = towardViewer();
  vec3 fp = onFloor(vb, ZL);
  float column = 0.;
  float tint = 0.;
  for (int i = 0; i < 5; i++) {
    vec4 e = uEm[i];
    if (e.w <= 0.) continue;
    float face = e.z + uRise;
    vec2 vxy = V.xy;
    float tt = dot(e.xy - p0.xy, vxy) / dot(vxy, vxy);
    vec3 q = p0 + tt * V;
    float dist = length(q.xy - e.xy);
    float r = e.w;
    float body = exp(-dist * dist / (r * r * .45));
    float zw = window(q.z, ZL, face, 2.5);
    float bands = .72 + .28 * sin((q.z + uTime * 46.) * .5);
    column += body * zw * bands * (.5 + .5 * smoothstep(face, ZL, q.z));
    float fr = length(fp.xy - e.xy);
    tint += exp(-fr * fr / (r * r * 3.4));
  }
  // the Syrus exhaust: closest approach of the pixel's ray to the plume axis (along -x)
  vec3 A = vec3(-1., 0., 0.);
  vec3 pl = uPl.xyz + vec3(0., 0., uRise);
  vec3 w0 = p0 - pl;
  float b = dot(V, A);
  float d = dot(V, w0);
  float ee = dot(A, w0);
  float den = max(1e-4, 1. - b * b);
  float t = (b * ee - d) / den;
  float s = (ee - b * d) / den;
  float pd = length((p0 + t * V) - (pl + s * A));
  float pr = uPl.w * (1. + s / 70.);
  float along = window(s, 0., 150., 6.) * exp(-s / (60. + 70. * uThrust));
  float jet = exp(-pd * pd / (pr * pr * .5)) * along * (.8 + .2 * sin(s * .55 - uTime * 30.));
  float core = exp(-pd * pd / (pr * pr * .12)) * window(s, 0., 40., 8.);
  float e = 1. - exp(-2.3 * (column * uField * 1.1 + tint * uField * .32 + (jet * 1.1 + core * .8) * uThrust));
  vec4 lightInk = inkFor(paperOf(e), .52 * smoothstep(.62, .92, e));
  vec3 glow = vec3(.25, .62, 1.) * e + vec3(.8, .95, 1.) * smoothstep(.6, 1., e);
  vec4 darkInk = vec4(glow * e, e);
  vec4 ink = mix(darkInk, lightInk, uLight);
  ink.rgb = min(ink.rgb, vec3(ink.a));
  float n = (hash12(gl_FragCoord.xy + uTime) - .5) / 255.;
  ink += vec4(n) * smoothstep(0., 1.5 / 255., ink.a);
  gl_FragColor = clamp(ink, 0., 1.);
}`;
const fieldCanvas = stage.querySelector(".fx-field");
const fieldLayer = typeof glLayer === "function" && fieldCanvas ? glLayer({ canvas: fieldCanvas, fragment: FIELD_FRAG, view: [D.W, D.H], camera: D.camera, uniforms: ["uField", "uThrust", "uRise"], fixed: { uLight: LIGHT_THEME, uEm: EM, uPl: D.plume } }) : null;
let fieldShown = false;
window.FX_FRAME = ({ field: f }) => {
  if (!fieldLayer) return;
  const level = f.i.x / Mo.iNom;
  const thrust = f.throttle.x;
  if (level < 0.002 && thrust < 0.002) {
    if (fieldShown) fieldLayer.clear();
    fieldShown = false;
    return;
  }
  fieldShown = true;
  fieldLayer.draw({ uField: Math.min(1, level), uThrust: thrust, uRise: liftNow() }, still.matches ? 0.8 : clock);
};

if (still.matches) touring = false;
const narrow = matchMedia("(hover: none), (max-width: 480px)");
const hint = root.querySelector(".fx-hint");
const wording = () => hint && (hint.textContent = narrow.matches ? "Tap to take apart" : "Hover the craft to take it apart");
wording();
narrow.addEventListener("change", wording);
window.addEventListener("resize", run);
place();
say(idleText());
</script></body></html>
